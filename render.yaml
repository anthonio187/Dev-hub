services:
  - type: web
    name: devhub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python seed.py --if-enabled && gunicorn app:app --workers 2 --threads 4 --timeout 60 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: SEED_DEMO
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: devhub-db
          property: connectionString

databases:
  - name: devhub-db
    plan: free
